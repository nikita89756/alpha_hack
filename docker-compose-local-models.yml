services:
  ollama:
    image: ollama/ollama:latest
    container_name: qwen-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_THREAD=12
      - OLLAMA_HOST=11434 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  model-loader:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/bash
    command: 
      - -c
      - |
        echo "Waiting for Ollama..."
        sleep 10
        echo "Pulling model..."
        ollama pull qwen2.5:32b-instruct-q2_K
        echo "Model downloaded!"
    restart: "no"

volumes:
  ollama_data: